<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Details - Campus Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html"
            >
                🎒 Campus Lost & Found
            </a>

            <a
                href="dashboard.html"
                class="btn btn-outline-light"
            >
                ← Back
            </a>

        </div>

    </nav>


    <!-- ==================== ITEM DETAILS ==================== -->

    <section class="py-5">

        <div class="container">


            <!-- Loading -->

            <div
                id="loading"
                class="text-center py-5"
            >

                <div
                    class="spinner-border text-primary"
                    role="status"
                ></div>

                <p class="text-muted mt-2">
                    Loading item...
                </p>

            </div>


            <!-- Item Container -->

            <div
                id="itemContainer"
                class="d-none"
            >

                <div class="row g-5 align-items-start">


                    <!-- ==================== IMAGE ==================== -->

                    <div class="col-lg-6">

                        <div class="card border-0 shadow-sm">

                            <img
                                id="itemImage"
                                class="item-detail-image"
                                alt="Item Image"
                            >

                            <div
                                id="noImage"
                                class="detail-no-image d-none"
                            >
                                📦
                            </div>

                        </div>

                    </div>


                    <!-- ==================== ITEM INFORMATION ==================== -->

                    <div class="col-lg-6">


                        <!-- Type & Category -->

                        <div class="mb-3">

                            <span
                                id="itemType"
                                class="badge"
                            ></span>

                            <span
                                id="itemCategory"
                                class="badge bg-secondary ms-2"
                            ></span>

                        </div>


                        <!-- Title -->

                        <h1
                            id="itemTitle"
                            class="fw-bold"
                        ></h1>


                        <!-- Description -->

                        <p
                            id="itemDescription"
                            class="text-muted fs-5"
                        ></p>


                        <hr>


                        <!-- Location -->

                        <div class="mb-3">

                            <strong>
                                📍 Location
                            </strong>

                            <p
                                id="itemLocation"
                                class="text-muted mb-0"
                            ></p>

                        </div>


                        <!-- Date -->

                        <div class="mb-3">

                            <strong>
                                📅 Date
                            </strong>

                            <p
                                id="itemDate"
                                class="text-muted mb-0"
                            ></p>

                        </div>


                        <!-- Posted By -->

                        <div class="mb-4">

                            <strong>
                                👤 Posted By
                            </strong>

                            <p
                                id="itemPostedBy"
                                class="text-muted mb-0"
                            ></p>

                        </div>


                        <!-- ==================== MESSAGE ==================== -->

                        <div
                            id="message"
                            class="mb-3"
                        ></div>


                        <!-- ==================== CLAIM SECTION ==================== -->

                        <div id="claimSection">


                            <!-- Claim Button -->

                            <button
                                id="claimBtn"
                                class="btn btn-primary btn-lg w-100"
                            >
                                🤝 Claim / Request Item
                            </button>


                            <!-- Claim Form -->

                            <div
                                id="claimForm"
                                class="mt-3 d-none"
                            >

                                <label
                                    for="claimMessage"
                                    class="form-label fw-semibold"
                                >
                                    Why is this item yours?
                                </label>


                                <textarea
                                    id="claimMessage"
                                    class="form-control mb-3"
                                    rows="4"
                                    placeholder="Describe something that proves this item belongs to you..."
                                ></textarea>


                                <div class="d-flex gap-2">


                                    <!-- Submit -->

                                    <button
                                        id="submitClaimBtn"
                                        class="btn btn-success"
                                    >
                                        Submit Claim
                                    </button>


                                    <!-- Cancel -->

                                    <button
                                        id="cancelClaimBtn"
                                        class="btn btn-outline-secondary"
                                    >
                                        Cancel
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ==================== ERROR ==================== -->

            <div
                id="errorContainer"
                class="d-none"
            >

                <div class="alert alert-danger text-center">

                    Unable to load item details.

                </div>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>
    <script src="js/item.js"></script>
    
    <script src="js/theme.js"></script>
    
</body>

</html>

<script src="js/auth.js"></script>
