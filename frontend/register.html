<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🎒 Campus Lost & Found
            </a>

            <a
                href="login.html"
                class="btn btn-outline-light"
            >
                Login
            </a>

        </div>
    </nav>


    <!-- Register Section -->
    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card border-0 shadow-lg">

                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">

                                <div style="font-size: 50px;">
                                    🎓
                                </div>

                                <h2 class="fw-bold">
                                    Create Account
                                </h2>

                                <p class="text-muted">
                                    Join your campus Lost & Found
                                </p>

                            </div>


                            <form id="registerForm">

                                <!-- Name -->
                                <div class="mb-3">

                                    <label
                                        for="name"
                                        class="form-label"
                                    >
                                        Full Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="name"
                                        placeholder="Enter your name"
                                        required
                                    >

                                </div>


                                <!-- Email -->
                                <div class="mb-3">

                                    <label
                                        for="email"
                                        class="form-label"
                                    >
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="Enter your email"
                                        required
                                    >

                                </div>


                                <!-- Password -->
                                <div class="mb-3">

                                    <label
                                        for="password"
                                        class="form-label"
                                    >
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Create a password"
                                        required
                                        minlength="6"
                                    >

                                </div>


                                <!-- Message -->
                                <div
                                    id="message"
                                    class="mb-3"
                                ></div>


                                <!-- Register Button -->
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >
                                    Create Account
                                </button>

                            </form>


                            <div class="text-center mt-4">

                                <p class="text-muted mb-0">
                                    Already have an account?
                                    <a href="login.html">
                                        Login
                                    </a>
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
