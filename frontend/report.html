<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Report Item - Campus Lost & Found
    </title>


    <!-- ==================== BOOTSTRAP ==================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==================== CUSTOM CSS ==================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================================================== -->
    <!--                      NAVBAR                        -->
    <!-- ================================================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">


            <a
                class="navbar-brand fw-bold"
                href="dashboard.html"
            >
                🎒 Campus Lost & Found
            </a>


            <a
                href="dashboard.html"
                class="btn btn-outline-light"
            >
                ← Dashboard
            </a>


        </div>

    </nav>



    <!-- ================================================== -->
    <!--                    REPORT FORM                     -->
    <!-- ================================================== -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div
                        class="card border-0 shadow-lg"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <!-- ========================== -->
                            <!--          HEADER            -->
                            <!-- ========================== -->

                            <div
                                class="text-center mb-4"
                            >

                                <div
                                    style="font-size: 50px;"
                                >
                                    📢
                                </div>


                                <h2
                                    id="reportTitle"
                                    class="fw-bold"
                                >
                                    Report an Item
                                </h2>


                                <p
                                    class="text-muted"
                                >
                                    Help someone find
                                    their belongings.
                                </p>

                            </div>



                            <!-- ========================== -->
                            <!--           FORM             -->
                            <!-- ========================== -->

                            <form id="reportForm">


                                <!-- ====================== -->
                                <!--          TYPE          -->
                                <!-- ====================== -->

                                <div class="mb-3">

                                    <label
                                        for="type"
                                        class="form-label fw-semibold"
                                    >
                                        Item Type
                                    </label>


                                    <select
                                        id="type"
                                        class="form-select"
                                        required
                                    >

                                        <option value="">
                                            Select Type
                                        </option>


                                        <option value="Lost">
                                            🔴 I Lost This Item
                                        </option>


                                        <option value="Found">
                                            🟢 I Found This Item
                                        </option>

                                    </select>

                                </div>



                                <!-- ====================== -->
                                <!--         TITLE          -->
                                <!-- ====================== -->

                                <div class="mb-3">

                                    <label
                                        for="title"
                                        class="form-label fw-semibold"
                                    >
                                        Item Name
                                    </label>


                                    <input
                                        type="text"
                                        id="title"
                                        class="form-control"
                                        placeholder="e.g. Black Wallet"
                                        required
                                    >

                                </div>



                                <!-- ====================== -->
                                <!--      DESCRIPTION       -->
                                <!-- ====================== -->

                                <div class="mb-3">

                                    <label
                                        for="description"
                                        class="form-label fw-semibold"
                                    >
                                        Description
                                    </label>


                                    <textarea
                                        id="description"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Describe the item, color, brand, identifying marks..."
                                        required
                                    ></textarea>

                                </div>



                                <!-- ====================== -->
                                <!--        CATEGORY        -->
                                <!-- ====================== -->

                                <div class="mb-3">

                                    <label
                                        for="category"
                                        class="form-label fw-semibold"
                                    >
                                        Category
                                    </label>


                                    <select
                                        id="category"
                                        class="form-select"
                                        required
                                    >

                                        <option value="">
                                            Select Category
                                        </option>


                                        <option value="Electronics">
                                            Electronics
                                        </option>


                                        <option value="Documents">
                                            Documents
                                        </option>


                                        <option value="Clothing">
                                            Clothing
                                        </option>


                                        <option value="Accessories">
                                            Accessories
                                        </option>


                                        <option value="Books">
                                            Books
                                        </option>


                                        <option value="Keys">
                                            Keys
                                        </option>


                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>



                                <!-- ====================== -->
                                <!--      LOCATION + DATE   -->
                                <!-- ====================== -->

                                <div class="row">


                                    <!-- Location -->

                                    <div
                                        class="col-md-7 mb-3"
                                    >

                                        <label
                                            for="location"
                                            class="form-label fw-semibold"
                                        >
                                            Location
                                        </label>


                                        <input
                                            type="text"
                                            id="location"
                                            class="form-control"
                                            placeholder="e.g. Central Library"
                                            required
                                        >

                                    </div>


                                    <!-- Date -->

                                    <div
                                        class="col-md-5 mb-3"
                                    >

                                        <label
                                            for="date"
                                            class="form-label fw-semibold"
                                        >
                                            Date
                                        </label>


                                        <input
                                            type="date"
                                            id="date"
                                            class="form-control"
                                            required
                                        >

                                    </div>


                                </div>



                                <!-- ====================== -->
                                <!--          IMAGE         -->
                                <!-- ====================== -->

                                <div class="mb-4">

                                    <label
                                        for="image"
                                        class="form-label fw-semibold"
                                    >
                                        Item Image
                                    </label>


                                    <input
                                        type="file"
                                        id="image"
                                        class="form-control"
                                        accept="image/jpeg,image/png,image/webp"
                                    >


                                    <div
                                        class="form-text"
                                    >
                                        JPG, PNG or WebP.
                                        Maximum 5 MB.
                                    </div>

                                </div>



                                <!-- ====================== -->
                                <!--         MESSAGE        -->
                                <!-- ====================== -->

                                <div
                                    id="message"
                                    class="mb-3"
                                ></div>



                                <!-- ====================== -->
                                <!--         SUBMIT         -->
                                <!-- ====================== -->

                                <button
                                    type="submit"
                                    id="submitBtn"
                                    class="btn btn-primary w-100 py-2"
                                >
                                    Post Item
                                </button>


                            </form>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- ================================================== -->
    <!--                    JAVASCRIPT                      -->
    <!-- ================================================== -->

    <!-- IMPORTANT:
         auth.js MUST load before report.js -->

    <script src="js/auth.js"></script>

    <script src="js/report.js"></script>
    <script src="js/theme.js"></script>

</body>

</html>
